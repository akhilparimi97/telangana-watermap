name: Deploy Telangana WaterMap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript syntax
        run: node --check apps/web/app.js
      - name: Validate static asset paths
        run: |
          test -f apps/web/index.html
          test -f apps/web/vendor/maplibre-gl.js
          test -f apps/web/data/vector/waterbodies/manifest.json
          test -f apps/web/data/vector/canals/manifest.json
          test -f apps/web/vendor/fonts/'Noto Sans Regular'/0-255.pbf
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static atlas
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
